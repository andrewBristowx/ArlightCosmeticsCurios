name: Compilar ArlightWeaponSkins 1.8.0

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/weaponskins-1.8.0-build-base

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'candidate/weaponskins-1.8.0-explicit-gecko-renderer'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar rama candidata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Descargar y verificar fuente canónica
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown 1h0MRxZFxvBjL7wNVPZfXoCJAUNinEKho -O /tmp/ArlightWeaponSkins-1.8.0-SOURCE.zip
          echo '8da3c659d85b110b03e81d8869db86bbb43f57dda1d5adfca026548b33af5daa  /tmp/ArlightWeaponSkins-1.8.0-SOURCE.zip' | sha256sum -c -
          rm -rf /tmp/weaponskins-source
          mkdir -p /tmp/weaponskins-source
          unzip -q /tmp/ArlightWeaponSkins-1.8.0-SOURCE.zip -d /tmp/weaponskins-source
          test -f /tmp/weaponskins-source/ArlightWeaponSkins-1.8.0-SOURCE/build.gradle
          python3 /tmp/weaponskins-source/ArlightWeaponSkins-1.8.0-SOURCE/tools/validate_1_8_0.py
          grep -q "maven.modrinth:vvuO3ImH:yohfFbgD" /tmp/weaponskins-source/ArlightWeaponSkins-1.8.0-SOURCE/build.gradle

      - name: Publicar fuente legible en la rama
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/weaponskins-source/ArlightWeaponSkins-1.8.0-SOURCE
          mkdir -p standalone/ArlightWeaponSkins
          rsync -a --delete --exclude 'libs/' --exclude '.gradle/' --exclude 'build/' "$SRC/" standalone/ArlightWeaponSkins/
          cat > standalone/ArlightWeaponSkins/DEPENDENCIAS_COMPILACION.txt <<'EOF'
          Compilar con:
          - Curios API 9.5.1+1.21.1
          - ArlightChatClient-5.3.0-WEAPON-SKINS-FIX.jar
          - ArlightCosmeticsCurios-1.17.0-WEAPON-SLOTS.jar
          Los binarios exactos se incluyen en el artefacto de entrega y no se versionan dentro del repositorio.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone/ArlightWeaponSkins
          if ! git diff --cached --quiet; then
            git commit -m 'Añadir Curios API al build de WeaponSkins 1.8.0'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar con NeoForge, Curios y GeckoLib
        shell: bash
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          SRC=/tmp/weaponskins-source/ArlightWeaponSkins-1.8.0-SOURCE
          cd "$SRC"
          chmod +x gradlew
          ./gradlew --no-daemon clean build
          test -f build/libs/ArlightWeaponSkins-1.8.0.jar
          unzip -p build/libs/ArlightWeaponSkins-1.8.0.jar META-INF/neoforge.mods.toml | grep -q 'version="1.8.0"'
          unzip -l build/libs/ArlightWeaponSkins-1.8.0.jar | grep -q 'WeaponSkinClientExtensions.class'
          unzip -l build/libs/ArlightWeaponSkins-1.8.0.jar | grep -q 'assets/arlightweaponskins/textures/item/somita_pickaxe.png'
          unzip -l build/libs/ArlightWeaponSkins-1.8.0.jar | grep -q 'assets/arlightcosmeticscurios/models/item/pony_weapon_sword.json'
          ! unzip -l build/libs/ArlightWeaponSkins-1.8.0.jar | grep -q 'top/theillusivec4/curios/'
          ! unzip -l build/libs/ArlightWeaponSkins-1.8.0.jar | grep -q 'com/arlight/chatclient/ClientCosmeticsState.class'

      - name: Empaquetar instalación compatible
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/weaponskins-source/ArlightWeaponSkins-1.8.0-SOURCE
          OUT="$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT/cliente-mods" "$OUT/servidor-mods"
          cp "$SRC/build/libs/ArlightWeaponSkins-1.8.0.jar" "$OUT/"
          cp "$SRC/build/libs/ArlightWeaponSkins-1.8.0.jar" "$OUT/cliente-mods/"
          cp "$SRC/build/libs/ArlightWeaponSkins-1.8.0.jar" "$OUT/servidor-mods/"
          cp "$SRC/libs/ArlightChatClient-5.3.0-WEAPON-SKINS-FIX.jar" "$OUT/cliente-mods/"
          cp "$SRC/libs/ArlightCosmeticsCurios-1.17.0-WEAPON-SLOTS.jar" "$OUT/cliente-mods/"
          cp "$SRC/libs/ArlightCosmeticsCurios-1.17.0-WEAPON-SLOTS.jar" "$OUT/servidor-mods/"
          cp /tmp/ArlightWeaponSkins-1.8.0-SOURCE.zip "$OUT/"
          cp "$SRC/PROBAR_1.8.0.txt" "$OUT/INSTALACION-Y-PRUEBAS.txt"
          cd "$OUT"
          sha256sum ArlightWeaponSkins-1.8.0.jar \
            cliente-mods/*.jar servidor-mods/*.jar \
            ArlightWeaponSkins-1.8.0-SOURCE.zip > ArlightWeaponSkins-1.8.0-SHA256.txt
          zip -qr ArlightWeaponSkins-1.8.0-COMPATIBLE-BUNDLE.zip \
            cliente-mods servidor-mods INSTALACION-Y-PRUEBAS.txt ArlightWeaponSkins-1.8.0-SHA256.txt
          unzip -t ArlightWeaponSkins-1.8.0-COMPATIBLE-BUNDLE.zip

      - name: Subir entrega completa
        uses: actions/upload-artifact@v4
        with:
          name: ArlightWeaponSkins-1.8.0-DELIVERY
          path: |
            package/ArlightWeaponSkins-1.8.0.jar
            package/ArlightWeaponSkins-1.8.0-SOURCE.zip
            package/ArlightWeaponSkins-1.8.0-COMPATIBLE-BUNDLE.zip
            package/ArlightWeaponSkins-1.8.0-SHA256.txt
          if-no-files-found: error
          retention-days: 90
