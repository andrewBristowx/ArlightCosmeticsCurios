name: Compilar ArlightCosmeticsCurios

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'build.gradle'
      - 'gradle/**'
      - 'src/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar fuente 1.15.0
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version = "1.15.0"' build.gradle
          grep -q '^ArlightCosmeticsCurios 1.15.0 ' BUILD_VERSION.txt
          grep -q '^ArlightCosmeticsCurios 1.15.0 ' SOURCE_VERSION.txt
          grep -Fq 'version = "${version}"' src/main/resources/META-INF/neoforge.mods.toml
          grep -q 'class CompanionEntity' src/main/java/com/arlight/cosmeticscurios/CompanionEntity.java
          grep -q 'class CompanionManager' src/main/java/com/arlight/cosmeticscurios/CompanionManager.java
          grep -q 'record CompanionPhysicsProfile' src/main/java/com/arlight/cosmeticscurios/CompanionPhysicsProfile.java
          grep -q 'STUCK_RESCUE_TICKS = 160' src/main/java/com/arlight/cosmeticscurios/CompanionEntity.java
          grep -q 'HARD_RESCUE_DISTANCE_SQ = 576.0D' src/main/java/com/arlight/cosmeticscurios/CompanionEntity.java
          grep -q 'STUCK_RESCUE_MIN_DISTANCE_SQ = 196.0D' src/main/java/com/arlight/cosmeticscurios/CompanionEntity.java
          grep -q 'class CompanionEntityRenderer' src/main/java/com/arlight/cosmeticscurios/client/CompanionEntityRenderer.java
          grep -q 'record CompanionVisualProfile' src/main/java/com/arlight/cosmeticscurios/client/CompanionVisualProfile.java
          ! test -e src/main/java/com/arlight/cosmeticscurios/client/CompanionMarkerRenderer.java
          grep -q 'trex_snout_gem_left' src/main/java/com/arlight/cosmeticscurios/client/ProfessionalCosmeticModels.java

      - name: Compilar con Gradle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build

      - name: Reunir JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          unzip -p dist/ArlightCosmeticsCurios-1.15.0.jar META-INF/neoforge.mods.toml | grep -Eq 'version *= *"1.15.0"'
          unzip -l dist/ArlightCosmeticsCurios-1.15.0.jar | grep -q 'PajamaRenderVisibility.class'
          unzip -l dist/ArlightCosmeticsCurios-1.15.0.jar | grep -q 'CompanionEntity.class'
          unzip -l dist/ArlightCosmeticsCurios-1.15.0.jar | grep -q 'CompanionManager.class'
          unzip -l dist/ArlightCosmeticsCurios-1.15.0.jar | grep -q 'CompanionPhysicsProfile.class'
          unzip -l dist/ArlightCosmeticsCurios-1.15.0.jar | grep -q 'CompanionEntityRenderer.class'
          unzip -l dist/ArlightCosmeticsCurios-1.15.0.jar | grep -q 'CompanionVisualProfile.class'
          ls -lh dist

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ArlightCosmeticsCurios-1.15.0-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
