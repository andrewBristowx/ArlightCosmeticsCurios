name: Compilar ArlightCosmeticsCurios

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Registrar ejecución
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/run-info
          printf '%s\n' "$GITHUB_RUN_ID" > .github/run-info/LAST_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/run-info/LAST_RUN_ID.txt
          if ! git diff --cached --quiet; then
            git commit -m "Registrar build ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Aplicar parche ArlightCosmeticsCurios 1.11.1
        shell: bash
        run: |
          set -euo pipefail
          PATCH_DIR='.github/patches/curios-1.11.1'
          test -f "$PATCH_DIR/changes.patch"
          git apply --check "$PATCH_DIR/changes.patch"
          git apply "$PATCH_DIR/changes.patch"
          TARGET='src/main/resources/assets/arlightcosmeticscurios/textures/cosmetics'
          mkdir -p "$TARGET"
          cp "$PATCH_DIR"/mobchibi_*.png "$TARGET/"
          rm -rf "$PATCH_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar ArlightCosmeticsCurios a 1.11.1 - Texture Armor Fit Fix'
            git push origin HEAD:main
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar con Gradle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build

      - name: Reunir JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lh dist

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ArlightCosmeticsCurios-1.11.1-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
